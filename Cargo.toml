[package]
name = "RustClear"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bevy = { version = "0.18.1", default-features = false, features = ["multi_threaded", "bevy_state", "debug"] }
bytes = "1.11.1"
slotmap = "1.1.1"
tokio = { version = "1.48.0", features = ["full"] }
macros = { path = "macros" }
glam = { version = "0.33.0", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4"] }
enumset = "1.1.13"
paste = "1.0.15"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
include_dir = "0.7.4"
rand = "0.9.4"
indoc = "2.0.7"
enum_dispatch = "0.3.13"
chrono = "0.4.45"
rapidhash = { version = "4.4.1", features = ["rng"] }

[lints.clippy]
type_complexity = "allow"
